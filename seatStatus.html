<!doctype html>
<html lang="en">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4a148c" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seat Status</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      /* Modern styles matching booking page */
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");

      :root {
        --primary-50: #eff6ff;
        --primary-500: #3b82f6;
        --primary-600: #2563eb;
        --primary-glow: rgba(37, 99, 235, 0.3);
        --secondary-500: #ec4899;
        --secondary-600: #db2777;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        min-height: 100vh;
        padding: 20px;
      }

      /* Heading */
      h1 {
        text-align: center;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #2563eb, #db2777);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 2rem;
      }

      /* Control buttons */
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
      }

      button {
        padding: 12px 20px;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        border: none;
        color: white;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
      }

      /* Seat map layout - matching booking page */
      .seat-map {
        display: flex;
        flex-direction: row-reverse;
        justify-content: center;
        gap: 20px;
        margin: auto;
        padding: 20px;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 16px;
        max-width: 600px;
      }

      .seat-column {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .seat {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 0.65rem;
        cursor: pointer;
        transition: all 0.3s;
        border: 2px solid transparent;
        padding: 2px;
        text-align: center;
        word-wrap: break-word;
        overflow: hidden;
        white-space: pre-line;
      }

      .seat:hover:not(.disabled) {
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
      }

      .seat.available {
        background: white;
        color: #4b5563;
        border-color: #e5e7eb;
      }

      .seat.booked {
        background: #ef4444;
        color: white;
      }

      .seat.half-booked {
        background: #f97316;
        color: white;
      }

      .seat.evening-booked {
        background: #a855f7;
        color: white;
      }

      .seat.selected {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
        transform: scale(1.1);
        border-color: transparent;
        box-shadow: 0 0 0 4px var(--primary-glow);
      }

      /* Details panel */
      .details-panel {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 0 10px rgba(0, 0, 0, 0.08);
        margin-top: 30px;
        max-width: 1000px;
        margin-left: auto;
        margin-right: auto;
        overflow-x: auto;
      }

      /* Table styling */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 14px;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
        vertical-align: middle;
      }

      th {
        background: #f9f9f9;
        font-weight: 600;
      }

      td button {
        background: #d32f2f;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }

      td button:hover {
        background: #b71c1c;
      }

      /* Responsive adjustments */
      /* ---- MOBILE CARD LAYOUT ---- */
      @media (max-width: 650px) {
        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
        }

        thead {
          display: none;
        }

        tr {
          background: #fff;
          margin-bottom: 12px;
          padding: 12px;
          border-radius: 12px;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        td {
          border: none;
          padding: 6px 0;
          display: flex;
          justify-content: space-between;
          font-size: 14px;
        }

        td::before {
          content: attr(data-label);
          font-weight: 600;
          color: #555;
        }

        .icon-btn {
          font-size: 20px !important;
        }

        .details-panel {
          padding: 12px;
        }
      }

      /* Make details panel mobile-friendly */

      /* Limit table column width on mobile */
      @media (max-width: 600px) {
        table th,
        table td {
          font-size: 12px;
          padding: 6px;
          white-space: nowrap;
        }

        .icon-btn {
          font-size: 20px;
          padding: 6px;
        }
      }

      /* Icon button styles */
      .icon-btn {
        font-size: 22px;
        cursor: pointer;
        text-decoration: none;
        padding: 5px;
        border-radius: 6px;
        display: inline-block;
      }

      .icon-call {
        color: #1976d2; /* blue */
      }

      .icon-wa {
        color: #25d366; /* WhatsApp green */
      }

      /* Mobile Responsive Styles */
      @media (max-width: 768px) {
        body {
          padding: 12px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .controls button {
          padding: 10px 16px;
          font-size: 0.9rem;
        }

        .seat-map {
          gap: 8px;
          padding: 12px;
          max-width: 100%;
        }

        .seat-column {
          gap: 6px;
        }

        .seat {
          width: 45px;
          height: 45px;
          font-size: 0.55rem;
          border-radius: 10px;
          padding: 1px;
        }

        .legend {
          padding: 15px;
        }

        .legend h3 {
          font-size: 1rem;
        }

        .legend-box {
          width: 24px !important;
          height: 24px !important;
          border-radius: 6px !important;
        }

        .legend span {
          font-size: 0.85rem;
        }

        .details-panel {
          padding: 15px;
          margin-top: 20px;
        }

        table {
          font-size: 12px;
        }
      }

      @media (max-width: 480px) {
        .seat {
          width: 40px;
          height: 40px;
          font-size: 0.5rem;
        }
        .seat-map {
          gap: 5px;
        }
        .legend {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Seat Status</h1>

    <div class="seat-map" id="seat-map"></div>

    <!-- Legend -->
    <div
      class="legend"
      style="
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      "
    >
      <h3 style="margin-bottom: 15px; color: #4b5563; text-align: center">
        Legend
      </h3>
      <div
        style="
          display: flex;
          gap: 15px;
          flex-wrap: wrap;
          justify-content: center;
        "
      >
        <div style="display: flex; align-items: center; gap: 8px">
          <div
            class="legend-box"
            style="
              width: 30px;
              height: 30px;
              border-radius: 8px;
              background: white;
              border: 1px solid #e5e7eb;
            "
          ></div>
          <span>Available</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <div
            class="legend-box"
            style="
              width: 30px;
              height: 30px;
              border-radius: 8px;
              background: #ef4444;
            "
          ></div>
          <span>Fully Booked</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <div
            class="legend-box"
            style="
              width: 30px;
              height: 30px;
              border-radius: 8px;
              background: #f97316;
            "
          ></div>
          <span>Morning Booked</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <div
            class="legend-box"
            style="
              width: 30px;
              height: 30px;
              border-radius: 8px;
              background: #a855f7;
            "
          ></div>
          <span>Evening Booked</span>
        </div>
      </div>
    </div>

    <div class="details-panel" id="details-panel">
      <h2>Select a seat above</h2>
    </div>

    <script>
      let dataLoaded = false;
      let lastSelectedSeat = null;

      const user = JSON.parse(localStorage.getItem("user"));
      if (!user || user.role !== "admin") {
        alert("Access denied! Admins only.");
        window.location.href = "login.html";
      }

      // ---- GLOBAL ----
      const totalSeats = 34;
      const seatMap = document.getElementById("seat-map");
      const detailsPanel = document.getElementById("details-panel");
      let bookings = [];
      let usersByEmail = {};

      // ---- SHOW SEATS IMMEDIATELY ----
      renderSeatMap();
      detailsPanel.innerHTML = `<h2>Loading data...</h2>`;

      // ---- LOAD BOOKING + USER DATA IN BACKGROUND ----
      window.onload = () => {
        loadAll().then(() => {
          dataLoaded = true;

          // If seat clicked before load finished, show its details now
          if (lastSelectedSeat) {
            showDetails(lastSelectedSeat);
          } else {
            detailsPanel.innerHTML = `<h2>Select a seat above</h2>`;
          }
        });
      };

      async function loadAll() {
        const [bookingRes, usersRes] = await Promise.all([
          fetch(`https://kanhabackend.onrender.com/api/bookings`),
          fetch(`https://kanhabackend.onrender.com/api/users`),
        ]);

        bookings = await bookingRes.json();
        const users = await usersRes.json();

        users.forEach((u) => {
          usersByEmail[u.email] = {
            name: `${u.firstName || ""} ${u.lastName || ""}`.trim(),
            email: u.email,
            mobile: u.mobile || "N/A",
          };
        });

        // Re-render seat map with updated data
        renderSeatMap();
      }

      // Get today's date in YYYY-MM-DD format
      function getTodayString() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      // ---- RENDER SEATS ----
      function renderSeatMap() {
        seatMap.innerHTML = "";

        // Create 3 columns like booking page
        const col1 = document.createElement("div");
        col1.className = "seat-column";
        const col2 = document.createElement("div");
        col2.className = "seat-column";
        const col3 = document.createElement("div");
        col3.className = "seat-column";

        const today = getTodayString();

        for (let i = 1; i <= totalSeats; i++) {
          const seatId = `${i}`;
          const el = document.createElement("div");
          el.className = "seat";
          el.dataset.seat = seatId;

          // Determine seat status and user for today
          const todayBookings = bookings.filter(
            (b) =>
              b.seatId === seatId && b.date === today && b.status === "paid",
          );

          let seatContent = seatId; // Default to seat number
          let seatClass = "available";

          if (todayBookings.length > 0) {
            // Check if any booking is full day
            const fullDayBooking = todayBookings.find(
              (b) => b.shift === "full",
            );
            const amBooking = todayBookings.find((b) => b.shift === "am");
            const pmBooking = todayBookings.find((b) => b.shift === "pm");

            if (fullDayBooking) {
              seatClass = "booked";
              const user = usersByEmail[fullDayBooking.email];
              if (user && user.name) {
                seatContent = user.name.split(" ")[0]; // First name
              }
            } else if (amBooking && pmBooking) {
              seatClass = "booked";
              // Get both users
              const amUser = usersByEmail[amBooking.email];
              const pmUser = usersByEmail[pmBooking.email];
              // Show both first names
              const amName =
                amUser && amUser.name ? amUser.name.split(" ")[0] : "";
              const pmName =
                pmUser && pmUser.name ? pmUser.name.split(" ")[0] : "";
              seatContent = `${amName}\n${pmName}`;
            } else if (amBooking) {
              seatClass = "half-booked";
              const user = usersByEmail[amBooking.email];
              if (user && user.name) {
                seatContent = user.name.split(" ")[0]; // First name
              }
            } else if (pmBooking) {
              seatClass = "evening-booked";
              const user = usersByEmail[pmBooking.email];
              if (user && user.name) {
                seatContent = user.name.split(" ")[0]; // First name
              }
            }
          }

          el.classList.add(seatClass);
          el.innerText = seatContent;

          el.onclick = () => {
            // highlight UI immediately
            document
              .querySelectorAll(".seat")
              .forEach((s) => s.classList.remove("selected"));
            el.classList.add("selected");

            // store selected seat
            lastSelectedSeat = seatId;

            if (!dataLoaded) {
              detailsPanel.innerHTML = `<h2>Seat ${seatId}</h2><p>Loading booking data...</p>`;
              return;
            }

            showDetails(seatId);
          };

          // Add seat to appropriate column
          if (i <= 12) {
            col1.appendChild(el);
          } else if (i <= 23) {
            col2.appendChild(el);
          } else {
            col3.appendChild(el);
          }
        }

        // Append columns in reverse order (like booking page)
        seatMap.appendChild(col3);
        seatMap.appendChild(col2);
        seatMap.appendChild(col1);
      }

      // ---- SHOW SEAT DETAILS ----
      function showDetails(seat) {
        const sb = bookings.filter((b) => b.seatId === seat);

        if (!sb.length) {
          detailsPanel.innerHTML = `<h2>${seat}</h2><p>No bookings.</p>`;
          return;
        }

        const grouped = {};
        sb.forEach((b) => {
          const user = usersByEmail[b.email] || {
            name: b.email,
            email: b.email,
            mobile: "N/A",
          };
          const key = `${b.email}_${b.shift}`;
          grouped[key] = grouped[key] || {
            name: user.name,
            email: user.email,
            mobile: user.mobile,
            shift: b.shift,
            pay: b.paymentMode,
            dates: [],
          };
          grouped[key].dates.push(b.date);
        });

        let html = `
    <h2>Seat Number - ${seat}</h2>
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Email</th>
          <th>Mobile</th>
          <th>Shift</th>
          <th>Payment</th>
          <th>From</th>
          <th>To</th>
          <th>Days</th>
          <th>Call</th>
          <th>WA</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
  `;

        Object.values(grouped).forEach((entry) => {
          entry.dates.sort();

          // Clean mobile number: remove +91 or 91 prefix, then remove non-digits
          const rawMobile = entry.mobile || "";
          const mobileClean = rawMobile
            .replace(/^\+?91/, "")
            .replace(/\D/g, "");

          html += `
<tr>
  <td data-label="User">${entry.name}</td>
  <td data-label="Email">${entry.email}</td>
  <td data-label="Mobile">${entry.mobile}</td>
  <td data-label="Shift">${entry.shift}</td>
  <td data-label="Payment">${entry.pay || "Online"}</td>
  <td data-label="From">${entry.dates[0]}</td>
  <td data-label="To">${entry.dates.at(-1)}</td>
  <td data-label="Days">${calculateDays(entry.dates[0], entry.dates.at(-1))}</td>

  <td data-label="Call">
    <a href="tel:+91${mobileClean}" class="icon-btn icon-call">
      <i class="fa-solid fa-phone"></i>
    </a>
  </td>

  <td data-label="WhatsApp">
    <a href="https://wa.me/91${mobileClean}" target="_blank" class="icon-btn icon-wa">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
  </td>

  <td data-label="Action">
    <button onclick="deleteBooking('${seat}', '${entry.email}', '${entry.shift}')">Remove</button>
  </td>
</tr>
`;
        });

        html += `</tbody></table>`;
        detailsPanel.innerHTML = html;
      }

      async function deleteBooking(seatId, email, shift) {
        if (!confirm("Are you sure you want to delete this booking?")) return;

        const res = await fetch(
          "https://kanhabackend.onrender.com/api/delete-bookings",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ seatId, email, shift }),
          },
        );

        const result = await res.json();

        if (result.success) {
          alert("Deleted successfully");
          loadAll().then(() => {
            renderSeatMap(); // Re-render seats after deletion
            showDetails(seatId);
          });
        } else {
          alert("Delete failed");
        }
      }

      function calculateDays(from, to) {
        const start = new Date(from);
        const end = new Date(to);
        return Math.floor((end - start) / (1000 * 60 * 60 * 24)) + 1;
      }
    </script>
  </body>
</html>
